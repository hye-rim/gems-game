<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>보석 상인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  /* 아이폰 사파리는 -webkit- 접두사를 붙여야 알아듣는다: 버튼을 누르다 글자가 파랗게 선택(블록)되거나
     길게 눌러 복사 메뉴가 뜨지 않게. 입력칸은 그대로 선택·붙여넣기 되게 둔다 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, [contenteditable] { -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }

  /* 작은 오락실 공통 스티커 스타일: 진한 남보라 테두리 + 아래로 떨어진 그림자 + 둥근 글꼴 */
  :root { --ink:#2b1d52; --yellow:#ffd23f; --pink:#ff5fa2; --muted:#6b5c95; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden;
    background:
      repeating-linear-gradient(-30deg, rgba(255,255,255,.07) 0 26px, transparent 26px 56px),
      linear-gradient(180deg, #4f8cff 0%, #6b5cff 55%, #8a4fe0 100%);
    font-family:'Jua', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    color:var(--ink);
    touch-action:none;
  }
  #stage { width:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; }
  #hud { display:flex; align-items:center; gap:6px; padding:0 2px 8px; font-variant-numeric:tabular-nums; width:100%; position:relative; z-index:2; }
  #hud .item {
    display:flex; align-items:center; gap:5px; white-space:nowrap;
    background:#fff; border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink);
    padding:2px 12px; height:38px;
  }
  #hud .item.score { background:var(--yellow); flex:1; min-width:0; }
  #hud .label { font-size:11px; color:var(--muted); }
  #hud .item.score .label { color:#8a5a00; }
  #hud .value { font-size:21px; }
  #hud .icons { display:flex; gap:6px; margin-left:auto; }
  #hud button {
    background:#fff; border:3px solid var(--ink); color:var(--ink); position:relative;
    width:36px; height:36px; border-radius:12px; font-size:15px; cursor:pointer; box-shadow:0 4px 0 var(--ink);
  }
  #hud button::after { content:''; position:absolute; inset:-10px -6px; }
  #hud button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #wrap { position:relative; }

  #overlay {
    position:absolute; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:safe center; gap:12px;
    text-align:center; padding:18px; background:rgba(43,29,82,.74); border-radius:22px;
    backdrop-filter:blur(3px); overflow-y:auto; touch-action:pan-y;
  }
  #overlay.hidden { display:none; }
  #overlay h1, #overlay h2 { color:#fff; font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay h1 { font-size:clamp(40px, 12vw, 54px); line-height:1.05; color:var(--yellow); }
  #overlay h2 { font-size:30px; }
  #overlay p { font-size:14px; line-height:1.55; color:#fff; }
  #overlay p b { color:var(--yellow); font-weight:400; }
  #overlay .big { font-size:48px; color:var(--yellow); font-variant-numeric:tabular-nums; line-height:1; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); }
  #overlay .tag { display:inline-block; background:var(--pink); color:#fff; font-size:15px; padding:3px 14px; border-radius:999px; border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); }
  #overlay .card2 {
    font-size:14px; color:var(--ink); line-height:1.7; text-align:left; background:#fff; border:3px solid var(--ink);
    border-radius:18px; box-shadow:0 5px 0 var(--ink); padding:10px 16px;
  }
  #overlay .stats { display:grid; grid-template-columns:auto auto; gap:3px 18px; font-size:16px; font-variant-numeric:tabular-nums; }
  #overlay .stats dt { color:var(--muted); text-align:right; }
  #overlay button {
    background:var(--yellow); color:var(--ink); font-size:21px; font-family:inherit; border:3px solid var(--ink);
    border-radius:999px; padding:10px 36px; box-shadow:0 5px 0 var(--ink); cursor:pointer;
  }
  #overlay button small { display:block; font-size:12px; color:var(--muted); margin-top:1px; }
  #overlay button.sub { background:#fff; font-size:16px; padding:7px 22px; box-shadow:0 4px 0 var(--ink); }
  #overlay button:active { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #overlay .col { display:flex; flex-direction:column; align-items:center; gap:9px; }

  @media (max-width:420px) {
    #hud { gap:4px; }
    #hud .label { display:none; }
    #hud .item { padding:2px 10px; height:34px; box-shadow:0 3px 0 var(--ink); }
    #hud .value { font-size:17px; }
    #hud button { width:32px; height:32px; font-size:13px; box-shadow:0 3px 0 var(--ink); }
  }
  @media (max-height:700px) {
    #overlay { gap:8px; padding:12px; }
    #overlay h1 { font-size:38px; } #overlay h2 { font-size:26px; } #overlay .big { font-size:38px; }
    #overlay p, #overlay .card2 { font-size:12.5px; }
    #overlay button { font-size:18px; padding:8px 28px; }
  }


  #col { width:min(100%, 420px); max-height:100dvh; overflow-y:auto; overflow-x:hidden; touch-action:pan-y; padding-bottom:6px; scrollbar-width:none; }
  #col::-webkit-scrollbar { display:none; }
  #stage { align-items:flex-start; justify-content:flex-start; }
  html, body { touch-action:pan-y; }
  #wrap { position:relative; width:100%; }
  #hud .item.score .value { font-size:17px; overflow:hidden; text-overflow:ellipsis; }
  #panel { background:rgba(255,255,255,.16); border:4px solid var(--ink); border-radius:22px; box-shadow:0 6px 0 var(--ink); padding:7px; display:flex; flex-direction:column; align-items:stretch; gap:6px; }

  /* 보석 색 */
  :root { --c0:#e5384f; --c1:#2f7dff; --c2:#25b457; --c3:#f4f4fa; --c4:#4a4260; --c5:#ffc61a; }
  .c0 { --gc:var(--c0); --gt:#fff; } .c1 { --gc:var(--c1); --gt:#fff; } .c2 { --gc:var(--c2); --gt:#fff; }
  .c3 { --gc:var(--c3); --gt:var(--ink); } .c4 { --gc:var(--c4); --gt:#fff; } .c5 { --gc:var(--c5); --gt:var(--ink); }
  .chip { position:relative; display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:50%; background:var(--gc); color:var(--gt); border:3px solid var(--ink); box-shadow:0 3px 0 var(--ink); font-style:normal; font-size:15px; flex:none; }
  .chip s { text-decoration:none; }
  .chip b { position:absolute; right:-7px; bottom:-8px; min-width:19px; height:19px; padding:0 3px; border-radius:999px; background:#fff; color:var(--ink); border:2px solid var(--ink); font-size:12px; font-weight:400; display:flex; align-items:center; justify-content:center; font-variant-numeric:tabular-nums; }
  .chip.dim { opacity:.35; box-shadow:none; }
  .chip.sel { transform:translateY(-6px); box-shadow:0 0 0 3px var(--yellow), 0 4px 0 var(--ink); }
  .cc { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:var(--gc); color:var(--gt); border:1.5px solid var(--ink); font-style:normal; font-size:10px; line-height:1; }
  .bon { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:17px; padding:0 3px; border-radius:5px; background:var(--gc); color:var(--gt); border:2px solid var(--ink); font-style:normal; font-size:11px; font-variant-numeric:tabular-nums; }
  .bon.zero { opacity:.3; }

  /* 상대·나 정보줄 */
  .pl { background:rgba(255,255,255,.92); border:3px solid var(--ink); border-radius:14px; box-shadow:0 3px 0 var(--ink); padding:5px 8px 7px; }
  .pl.on { background:#fff3c4; }
  .pl .hd { display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:5px; }
  .pl .hd .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pl .hd .pt { background:var(--yellow); border:2px solid var(--ink); border-radius:999px; padding:0 9px; font-size:14px; font-variant-numeric:tabular-nums; }
  .pl .hd .sm { font-size:12px; color:var(--muted); }
  .stock { display:grid; grid-template-columns:repeat(6, 1fr); gap:2px 4px; justify-items:center; align-items:center; }
  .stock .chip { width:28px; height:28px; font-size:13px; }
  .stock .chip b { font-size:11px; min-width:17px; height:17px; }
  .pl.me .stock .chip.tk { cursor:pointer; }

  /* 귀족 */
  #nobles { display:flex; gap:6px; justify-content:center; align-items:center; min-height:50px; }
  .noble { width:62px; height:52px; border:3px solid var(--ink); border-radius:10px; background:#fff0f8; box-shadow:0 3px 0 var(--ink); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:3px; gap:1px; }
  .noble .np { position:absolute; left:3px; top:0; font-size:15px; color:#b0244f; }
  .noble .nr { display:flex; gap:2px; flex-wrap:wrap; justify-content:center; padding:0 3px; }
  .noble .nr .bon { min-width:17px; height:16px; font-size:10px; }
  .noble.pick { cursor:pointer; box-shadow:0 0 0 4px var(--yellow), 0 3px 0 var(--ink); animation:pulse 1s ease-in-out infinite alternate; }
  .noble.pending { box-shadow:0 0 0 3px var(--yellow); }
  @keyframes pulse { from { transform:translateY(0); } to { transform:translateY(-3px); } }
  .nlabel { font-size:11px; color:#fff; text-shadow:0 1px 0 var(--ink); text-align:center; }

  /* 시장 */
  #market { display:flex; flex-direction:column; gap:5px; }
  .mrow { display:flex; gap:5px; align-items:center; justify-content:center; }
  .deck { width:42px; height:70px; border-radius:9px; border:3px solid var(--ink); background:repeating-linear-gradient(45deg,#6b5cff 0 6px,#5646e6 6px 12px); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; line-height:1.25; flex:none; box-shadow:0 3px 0 var(--ink); text-shadow:0 1px 0 var(--ink); }
  .deck b { font-size:17px; font-weight:400; }
  .deck.l1 { background:repeating-linear-gradient(45deg,#2a9d8f 0 6px,#22867a 6px 12px); }
  .deck.l2 { background:repeating-linear-gradient(45deg,#e9a23b 0 6px,#d28e2a 6px 12px); }
  .deck.l3 { background:repeating-linear-gradient(45deg,#6b5cff 0 6px,#5646e6 6px 12px); }
  .deck.empty { opacity:.3; }
  .card { width:62px; height:70px; border:3px solid var(--ink); border-radius:9px; background:#fff; position:relative; box-shadow:0 3px 0 var(--ink); cursor:pointer; flex:none; overflow:hidden; }
  .card .top { height:24px; background:var(--gc); display:flex; align-items:center; justify-content:space-between; padding:0 4px; color:var(--gt); border-bottom:2px solid var(--ink); }
  .card .top .pp { font-size:17px; line-height:1; }
  .card .top .pp.z { opacity:0; }
  .card .top .bg { width:18px; height:18px; border-radius:50%; border:2px solid var(--ink); background:var(--gc); color:var(--gt); display:flex; align-items:center; justify-content:center; font-size:10px; filter:none; }
  .card .top.c3 .bg { background:#fff; color:var(--ink); }
  .card .top.c4 .bg { background:#6d6489; }
  .card .cost { position:absolute; left:3px; bottom:2px; right:3px; display:flex; flex-wrap:wrap; gap:2px 2px; }
  .card.empty { visibility:hidden; }
  .card.can { box-shadow:0 0 0 3px #4cd964, 0 3px 0 var(--ink); }
  .card.res { box-shadow:0 0 0 3px var(--pink), 0 3px 0 var(--ink); }
  .card.res.can { box-shadow:0 0 0 3px #4cd964, 0 3px 0 var(--ink); }
  .card.back { background:repeating-linear-gradient(45deg,#6b5cff 0 6px,#5646e6 6px 12px); cursor:default; }
  .card.new { animation:pop .35s ease-out; }
  @keyframes pop { from { transform:scale(.6); opacity:.2; } to { transform:scale(1); opacity:1; } }
  .mine-res { display:flex; gap:6px; align-items:center; justify-content:center; }
  .mine-res .lbl { font-size:11px; color:#fff; text-shadow:0 1px 0 var(--ink); width:34px; text-align:center; line-height:1.2; }

  /* 보석 더미(가져오기) */
  #bank { display:flex; gap:7px; justify-content:center; align-items:center; padding:7px 0 9px; background:rgba(255,255,255,.2); border-radius:14px; }
  #bank .chip { width:40px; height:40px; font-size:18px; cursor:pointer; }
  #bank .chip.gold { cursor:default; }
  #ctl { display:flex; width:100%; justify-content:center; gap:8px; }
  #takeBtn, #clearBtn { font:inherit; font-size:17px; color:var(--ink); background:var(--yellow); border:3px solid var(--ink); border-radius:999px; box-shadow:0 5px 0 var(--ink); padding:7px 14px; cursor:pointer; white-space:nowrap; }
  #takeBtn { flex:1; max-width:230px; background:#4cd964; }
  #clearBtn { background:#fff; font-size:15px; padding:7px 12px; }
  #takeBtn:active:not(:disabled), #clearBtn:active:not(:disabled) { transform:translateY(4px); box-shadow:0 1px 0 var(--ink); }
  #takeBtn:disabled, #clearBtn:disabled { opacity:.45; cursor:default; }
  #msg { min-height:34px; white-space:pre-line; font-size:14px; color:#fff; text-shadow:0 2px 0 var(--ink); text-align:center; line-height:1.35; }

  /* 카드 눌렀을 때 뜨는 창 */
  #sheet { position:absolute; inset:0; z-index:30; background:rgba(43,29,82,.7); border-radius:22px; display:flex; align-items:center; justify-content:center; padding:14px; }
  #sheet.hidden { display:none; }
  #sheet .box { background:#fff; border:4px solid var(--ink); border-radius:20px; box-shadow:0 6px 0 var(--ink); padding:14px 16px; display:flex; flex-direction:column; align-items:center; gap:9px; width:min(100%, 300px); }
  #sheet .big .card { transform:scale(1.5); margin:16px 24px 18px; cursor:default; }
  #sheet .info { font-size:14px; line-height:1.5; text-align:center; }
  #sheet .info b { font-weight:400; color:#c4204b; }
  #sheet .acts { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  #sheet button { font:inherit; font-size:17px; border:3px solid var(--ink); border-radius:999px; padding:8px 18px; background:var(--yellow); color:var(--ink); box-shadow:0 4px 0 var(--ink); cursor:pointer; }
  #sheet button.sub { background:#fff; font-size:15px; }
  #sheet button:disabled { opacity:.4; cursor:default; }
  #sheet button:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }

  #overlay .stats { grid-template-columns:auto auto; }
  #overlay .row { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  #overlay .row button { min-width:0; }
  #overlay input {
    background:#fff; border:3px solid var(--ink); color:var(--ink); box-shadow:0 4px 0 var(--ink);
    font-size:18px; font-family:inherit; text-align:center;
    border-radius:999px; padding:8px 16px; width:210px; user-select:text; outline:none;
  }
  #overlay input::placeholder { color:#a99fc9; }
  #overlay input:focus { box-shadow:0 4px 0 var(--ink), 0 0 0 4px rgba(255,210,63,.6); }
  #overlay .join input { width:124px; letter-spacing:.2em; text-transform:uppercase; }
  #overlay .error { font-size:15px; color:#ffb3c4; min-height:1em; paint-order:stroke fill; -webkit-text-stroke:4px var(--ink); }
  #overlay .back { background:none; border:none; box-shadow:none; color:#fff; font-size:16px; cursor:pointer; padding:6px; font-family:inherit; opacity:.9; min-width:0; }
  #overlay .code { color:var(--yellow); font-weight:400; paint-order:stroke fill; -webkit-text-stroke:6px var(--ink); text-shadow:0 5px 0 var(--ink); font-size:56px; letter-spacing:.16em; font-variant-numeric:tabular-nums; -webkit-user-select:text; user-select:text; -webkit-touch-callout:default; }
  #overlay .dots { display:flex; gap:10px; }
  #overlay .dots span { width:14px; height:14px; border-radius:50%; background:var(--yellow); border:3px solid var(--ink); animation:blink 1.2s infinite; }
  #overlay .dots span:nth-child(2) { animation-delay:.2s; }
  #overlay .dots span:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity:.25; transform:scale(.85); } 40% { opacity:1; transform:scale(1); } }
  @media (max-height:700px) { #panel { gap:5px; padding:6px; } #msg { min-height:30px; font-size:13px; } }
</style>
</head>
<body>
<div id="stage">
  <div id="col">
    <div id="hud">
      <div class="item score"><span class="value" id="turn">보석 상인</span></div>
      <div class="item"><span class="label">WIN</span><span class="value" id="wins">0</span></div>
      <div class="icons">
        <button id="resignBtn" title="기권" style="display:none">🏳</button>
        <button id="muteBtn" title="소리 (M)">🔊</button>
      </div>
    </div>
    <div id="wrap">
      <div id="panel">
        <div id="opp" class="pl"></div>
        <div id="nobles"></div>
        <div id="market"></div>
        <div id="bank"></div>
        <div id="ctl"><button id="clearBtn">취소</button><button id="takeBtn">💎 가져오기</button></div>
        <div id="msg"></div>
        <div id="me" class="pl me"></div>
        <div id="mres" class="mine-res"></div>
      </div>
      <div id="sheet" class="hidden"></div>
      <div id="overlay"></div>
    </div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
